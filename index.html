<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>CLOrad</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>

/* =========================
   BASE
========================= */

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  margin:0;
  overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  background:#11151b;
  color:#f2f4f6;
}

button,input,select{
  font:inherit;
}

button{
  border:0;
  cursor:pointer;
}

#map{
  position:fixed;
  inset:0;
  z-index:0;
  background:#05070a;
}

.leaflet-control-attribution{
  background:rgba(14,18,23,.75)!important;
  color:#7e8790!important;
  font-size:9px!important;
}

.leaflet-control-attribution a{
  color:#89939d!important;
}

/* =========================
   SVG
========================= */

svg{
  display:block;
}

.icon{
  width:26px;
  height:26px;
  fill:none;
  stroke:currentColor;
  stroke-width:2.3;
  stroke-linecap:round;
  stroke-linejoin:round;
}

/* =========================
   RADAR LOGO
========================= */

.brand{
  position:absolute;
  left:21px;
  top:50%;
  transform:translateY(-50%);
  display:flex;
  align-items:center;
  gap:11px;
  z-index:20;
  user-select:none;
}

.radar-logo{
  position:relative;
  width:55px;
  height:55px;
  border:2px solid #54e7a1;
  border-radius:50%;
  background:#11171c;
  box-shadow:0 0 14px rgba(69,225,157,.08);
  overflow:hidden;
}

.radar-logo:before,
.radar-logo:after{
  content:"";
  position:absolute;
  left:50%;
  top:50%;
  border:1px solid rgba(84,231,161,.48);
  border-radius:50%;
  transform:translate(-50%,-50%);
}

.radar-logo:before{
  width:34px;
  height:34px;
}

.radar-logo:after{
  width:18px;
  height:18px;
}

.radar-dot{
  position:absolute;
  width:6px;
  height:6px;
  border-radius:50%;
  background:#54e7a1;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  z-index:3;
  box-shadow:0 0 8px #54e7a1;
}

.radar-sweep{
  position:absolute;
  width:50%;
  height:50%;
  left:50%;
  top:50%;
  transform-origin:0 0;
  background:linear-gradient(
    45deg,
    rgba(84,231,161,.55),
    rgba(84,231,161,0)
  );
  clip-path:polygon(0 0,100% 0,0 100%);
  animation:radarSweep 2.8s linear infinite;
  z-index:2;
}

@keyframes radarSweep{
  from{transform:rotate(0deg)}
  to{transform:rotate(360deg)}
}

.brand-name{
  font-size:39px;
  line-height:1;
  font-weight:800;
  letter-spacing:-2px;
  color:#f3f5f6;
}

/* =========================
   HEADER
========================= */

.header{
  position:fixed;
  left:0;
  right:0;
  top:0;
  height:125px;
  background:rgba(13,17,23,.96);
  border-bottom:1px solid rgba(255,255,255,.035);
  z-index:10;
}

.header-actions{
  position:absolute;
  right:25px;
  top:50%;
  transform:translateY(-50%);
  display:flex;
  align-items:center;
  gap:17px;
}

.header-btn{
  width:51px;
  height:51px;
  border-radius:13px;
  background:transparent;
  color:#aeb6bf;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:.2s;
}

.header-btn:hover{
  color:#fff;
  background:#202832;
}

.header-btn.search{
  background:#27313b;
  color:#aeb8c2;
}

.header-btn .icon{
  width:30px;
  height:30px;
}

.notification{
  position:relative;
}

.notification:after{
  content:"";
  position:absolute;
  width:10px;
  height:10px;
  border-radius:50%;
  background:#ff5965;
  right:7px;
  top:7px;
}

/* =========================
   MOBILE MENU
========================= */

.mobile-menu{
  position:fixed;
  right:16px;
  top:78px;
  width:235px;
  padding:8px;
  background:#171d24;
  border:1px solid #303944;
  border-radius:15px;
  box-shadow:0 18px 50px rgba(0,0,0,.45);
  display:none;
  z-index:50;
}

.mobile-menu.open{
  display:block;
}

.mobile-menu button{
  width:100%;
  padding:13px 14px;
  text-align:left;
  color:#d9dee3;
  background:transparent;
  border-radius:10px;
}

.mobile-menu button:hover{
  background:#242d36;
}

/* =========================
   NAVIGATION
========================= */

.nav{
  position:fixed;
  left:0;
  right:0;
  top:125px;
  height:130px;
  background:#252e37;
  border-bottom:1px solid rgba(255,255,255,.08);
  z-index:9;
  display:flex;
  align-items:stretch;
  overflow-x:auto;
  scrollbar-width:none;
}

.nav::-webkit-scrollbar{
  display:none;
}

.nav-item{
  position:relative;
  min-width:118px;
  height:130px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:11px;
  color:#9ca5ae;
  background:transparent;
  font-size:20px;
  font-weight:500;
  white-space:nowrap;
}

.nav-item .icon{
  width:38px;
  height:38px;
}

.nav-item.active{
  color:#52e3a0;
}

.nav-item.active:after{
  content:"";
  position:absolute;
  height:4px;
  left:17px;
  right:17px;
  bottom:0;
  background:#52e3a0;
  border-radius:3px 3px 0 0;
}

/* =========================
   MAP TOOLS
========================= */

.map-tools{
  position:fixed;
  left:17px;
  top:275px;
  z-index:8;
  display:flex;
  flex-direction:column;
  gap:12px;
}

.map-tool{
  width:78px;
  height:78px;
  border-radius:15px;
  background:#171d25;
  border:1px solid #303943;
  color:#e3e7ea;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 6px 18px rgba(0,0,0,.3);
}

.map-tool .icon{
  width:37px;
  height:37px;
}

.map-tool:active{
  transform:scale(.96);
}

/* =========================
   CENTER CROSSHAIR
========================= */

.center-cross{
  position:fixed;
  left:50%;
  top:53%;
  transform:translate(-50%,-50%);
  width:52px;
  height:52px;
  z-index:3;
  pointer-events:none;
  opacity:.55;
}

.center-cross:before,
.center-cross:after{
  content:"";
  position:absolute;
  background:#b5bcc3;
}

.center-cross:before{
  width:2px;
  height:52px;
  left:25px;
  top:0;
}

.center-cross:after{
  width:52px;
  height:2px;
  left:0;
  top:25px;
}

/* =========================
   LAYER PANEL
========================= */

.layer-panel{
  position:fixed;
  left:18px;
  top:53%;
  transform:translateY(-50%);
  width:280px;
  padding:14px 16px;
  border-radius:17px;
  background:rgba(22,28,36,.96);
  border:1px solid #343d47;
  box-shadow:0 12px 30px rgba(0,0,0,.36);
  z-index:7;
}

.layer-row{
  height:76px;
  display:flex;
  align-items:center;
  gap:16px;
}

.layer-icon{
  width:39px;
  height:39px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#54e7a1;
  flex:none;
}

.layer-icon.blue{
  color:#4fa8ff;
}

.layer-icon.red{
  color:#ff777d;
}

.layer-icon .icon{
  width:35px;
  height:35px;
}

.layer-name{
  flex:1;
  color:#e0e4e7;
  font-size:23px;
  font-weight:500;
}

/* =========================
   SWITCH
========================= */

.switch{
  position:relative;
  width:75px;
  height:44px;
  border-radius:30px;
  background:#3a424b;
  flex:none;
  transition:.2s;
}

.switch span{
  position:absolute;
  width:34px;
  height:34px;
  border-radius:50%;
  left:5px;
  top:5px;
  background:#e8ebed;
  transition:.2s;
  box-shadow:0 2px 5px rgba(0,0,0,.3);
}

.switch.on{
  background:#42d790;
}

.switch.on span{
  left:36px;
}

.switch:active{
  transform:scale(.96);
}

/* =========================
   DATA STRIP
========================= */

.data-strip{
  position:fixed;
  left:18px;
  right:18px;
  bottom:155px;
  height:102px;
  border-radius:17px;
  background:rgba(19,25,32,.96);
  border:1px solid #303944;
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  z-index:7;
  overflow:hidden;
  box-shadow:0 10px 28px rgba(0,0,0,.3);
}

.data-cell{
  padding:15px 18px;
  border-right:1px solid #303944;
}

.data-cell:last-child{
  border-right:0;
}

.data-label{
  color:#8d969f;
  font-size:13px;
  letter-spacing:1px;
  text-transform:uppercase;
  margin-bottom:8px;
}

.data-value{
  color:#eef1f3;
  font-size:22px;
  font-weight:650;
}

/* =========================
   ALERT
========================= */

.alert{
  position:fixed;
  right:20px;
  top:272px;
  width:300px;
  padding:14px 15px;
  border-radius:14px;
  background:rgba(29,25,27,.96);
  border:1px solid #55383d;
  z-index:8;
  display:none;
}

.alert.show{
  display:flex;
}

.alert-icon{
  width:36px;
  color:#ff737b;
  flex:none;
}

.alert-content{
  flex:1;
}

.alert-title{
  font-size:15px;
  font-weight:700;
}

.alert-text{
  color:#929ba4;
  font-size:13px;
  margin-top:4px;
}

.alert-close{
  background:transparent;
  color:#929ba4;
  font-size:22px;
}

/* =========================
   TIMELINE
========================= */

.timeline{
  position:fixed;
  left:18px;
  right:18px;
  bottom:18px;
  height:116px;
  border-radius:18px;
  background:rgba(18,24,31,.97);
  border:1px solid #303944;
  z-index:9;
  box-shadow:0 10px 35px rgba(0,0,0,.38);
}

.timeline-top{
  height:49px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 24px;
}

.timeline-now{
  font-size:18px;
  font-weight:650;
}

.timeline-date{
  font-size:17px;
  color:#d6dadd;
}

.timeline-main{
  height:67px;
  display:flex;
  align-items:center;
  gap:13px;
  padding:0 13px 8px;
}

.time-btn{
  width:53px;
  height:53px;
  border-radius:50%;
  background:#edf0f2;
  color:#151b20;
  flex:none;
  display:flex;
  align-items:center;
  justify-content:center;
}

.time-btn.dark{
  width:43px;
  height:43px;
  border-radius:12px;
  background:#202831;
  border:1px solid #39434e;
  color:#dce1e4;
}

.time-btn .icon{
  width:27px;
  height:27px;
}

.slider-area{
  flex:1;
  min-width:0;
  position:relative;
}

.timeline-range{
  width:100%;
  margin:0;
  appearance:none;
  height:7px;
  border-radius:10px;
  background:#d8dbdd;
  outline:none;
}

.timeline-range::-webkit-slider-thumb{
  appearance:none;
  width:44px;
  height:32px;
  border-radius:17px;
  background:#f4f5f6;
  border:0;
  box-shadow:0 2px 6px rgba(0,0,0,.25);
}

.timeline-range::-moz-range-thumb{
  width:44px;
  height:32px;
  border-radius:17px;
  background:#f4f5f6;
  border:0;
}

.time-labels{
  display:flex;
  justify-content:space-between;
  margin-top:8px;
  color:#858e97;
  font-size:12px;
}

/* =========================
   SPEED
========================= */

.speed{
  position:absolute;
  right:14px;
  top:-38px;
  display:flex;
  gap:4px;
}

.speed button{
  background:transparent;
  color:#8e969f;
  font-size:13px;
}

.speed button.active{
  color:#fff;
  font-weight:700;
}

/* =========================
   SEARCH
========================= */

.search-box{
  position:fixed;
  right:25px;
  top:80px;
  width:300px;
  background:#171d24;
  border:1px solid #333c46;
  border-radius:14px;
  padding:10px;
  z-index:60;
  display:none;
  box-shadow:0 18px 45px rgba(0,0,0,.45);
}

.search-box.open{
  display:flex;
}

.search-box input{
  width:100%;
  height:43px;
  border:0;
  outline:0;
  border-radius:10px;
  background:#222a33;
  color:#fff;
  padding:0 13px;
}

.search-result{
  position:absolute;
  top:58px;
  left:10px;
  right:10px;
  padding:12px;
  border-radius:10px;
  background:#202831;
  color:#cfd5d9;
  display:none;
}

/* =========================
   SETTINGS
========================= */

.settings{
  position:fixed;
  right:20px;
  top:275px;
  width:270px;
  background:#171d24;
  border:1px solid #333c46;
  border-radius:16px;
  padding:14px;
  z-index:40;
  display:none;
  box-shadow:0 18px 50px rgba(0,0,0,.45);
}

.settings.open{
  display:block;
}

.settings-title{
  font-size:18px;
  font-weight:700;
  padding:5px 4px 13px;
}

.settings button{
  width:100%;
  padding:12px;
  margin-top:5px;
  border-radius:10px;
  background:#202831;
  color:#d9dfe3;
  text-align:left;
}

.settings button.active{
  background:#2c5645;
  color:#61e8a6;
}

/* =========================
   TOAST
========================= */

.toast{
  position:fixed;
  left:50%;
  bottom:150px;
  transform:translate(-50%,15px);
  background:#222a33;
  border:1px solid #3a4651;
  color:#e8ecef;
  border-radius:11px;
  padding:10px 15px;
  opacity:0;
  pointer-events:none;
  transition:.25s;
  z-index:100;
  font-size:14px;
}

.toast.show{
  opacity:1;
  transform:translate(-50%,0);
}

/* =========================
   LIGHT THEME
========================= */

body.light{
  color:#182027;
}

body.light .header{
  background:rgba(246,248,249,.96);
}

body.light .brand-name{
  color:#161d23;
}

body.light .nav{
  background:#e9edf0;
}

body.light .nav-item{
  color:#69737c;
}

body.light .layer-panel,
body.light .data-strip,
body.light .timeline,
body.light .settings,
body.light .mobile-menu,
body.light .search-box{
  background:rgba(246,248,249,.96);
  border-color:#d1d7dc;
}

body.light .layer-name,
body.light .data-value,
body.light .timeline-now,
body.light .timeline-date{
  color:#20282e;
}

body.light .data-cell{
  border-color:#d4d9dd;
}

body.light .header-btn{
  color:#626d76;
}

body.light .header-btn.search,
body.light .time-btn.dark,
body.light .settings button{
  background:#e3e7ea;
  color:#283139;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:700px){

  .header{
    height:125px;
  }

  .brand{
    left:20px;
    gap:10px;
  }

  .radar-logo{
    width:54px;
    height:54px;
  }

  .brand-name{
    font-size:34px;
  }

  .header-actions{
    right:13px;
    gap:2px;
  }

  .header-btn{
    width:47px;
    height:47px;
  }

  .header-btn:nth-child(2){
    display:none;
  }

  .nav{
    top:125px;
    height:130px;
  }

  .nav-item{
    min-width:112px;
    height:130px;
    font-size:19px;
  }

  .map-tools{
    left:17px;
    top:273px;
    gap:10px;
  }

  .map-tool{
    width:78px;
    height:78px;
  }

  .layer-panel{
    left:18px;
    top:54%;
    width:277px;
  }

  .layer-row{
    height:70px;
  }

  .layer-name{
    font-size:22px;
  }

  .data-strip{
    bottom:149px;
    height:94px;
  }

  .data-cell{
    padding:12px 14px;
  }

  .data-label{
    font-size:11px;
  }

  .data-value{
    font-size:18px;
  }

  .timeline{
    left:13px;
    right:13px;
    bottom:12px;
    height:125px;
  }

  .timeline-top{
    height:48px;
    padding:0 15px;
  }

  .timeline-now{
    font-size:14px;
  }

  .timeline-date{
    font-size:13px;
  }

  .timeline-main{
    gap:7px;
    padding:0 9px 8px;
  }

  .time-btn{
    width:48px;
    height:48px;
  }

  .time-btn.dark{
    width:41px;
    height:41px;
  }

  .timeline-range::-webkit-slider-thumb{
    width:43px;
    height:31px;
  }

  .time-labels{
    font-size:10px;
  }

  .settings{
    right:12px;
    top:267px;
    width:250px;
  }

  .search-box{
    right:12px;
    width:calc(100% - 24px);
  }

  .alert{
    left:18px;
    right:18px;
    top:270px;
    width:auto;
  }

  .center-cross{
    top:54%;
  }
}

/* =========================
   SMALL PHONE
========================= */

@media(max-width:420px){

  .brand{
    left:13px;
  }

  .radar-logo{
    width:49px;
    height:49px;
  }

  .brand-name{
    font-size:29px;
  }

  .header-actions{
    right:7px;
  }

  .header-btn{
    width:43px;
  }

  .nav-item{
    min-width:101px;
    font-size:17px;
  }

  .nav-item .icon{
    width:34px;
    height:34px;
  }

  .map-tool{
    width:73px;
    height:73px;
  }

  .layer-panel{
    width:267px;
  }

  .layer-name{
    font-size:20px;
  }

  .data-strip{
    left:12px;
    right:12px;
  }

  .data-cell{
    padding:10px;
  }

  .data-value{
    font-size:16px;
  }

  .timeline{
    left:9px;
    right:9px;
  }

  .timeline-main{
    gap:4px;
  }

  .time-btn{
    width:44px;
    height:44px;
  }

  .time-btn.dark{
    width:38px;
    height:38px;
  }
}

</style>
</head>

<body>

<!-- =========================
     MAP
========================= -->

<div id="map"></div>
<div class="center-cross"></div>


<!-- =========================
     HEADER
========================= -->

<header class="header">

  <div class="brand">

    <div class="radar-logo">
      <div class="radar-sweep"></div>
      <div class="radar-dot"></div>
    </div>

    <div class="brand-name">CLOrad</div>

  </div>


  <div class="header-actions">

    <!-- Search -->

    <button class="header-btn search" id="searchBtn" aria-label="Поиск">
      <svg class="icon" viewBox="0 0 24 24">
        <circle cx="10.8" cy="10.8" r="6.8"></circle>
        <path d="M16 16l5 5"></path>
      </svg>
    </button>


    <!-- Theme -->

    <button class="header-btn" id="themeBtn" aria-label="Оформление">
      <svg class="icon" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="4"></circle>
        <path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"></path>
      </svg>
    </button>


    <!-- Notifications -->

    <button class="header-btn notification" id="notifyBtn" aria-label="Уведомления">
      <svg class="icon" viewBox="0 0 24 24">
        <path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"></path>
        <path d="M10 21h4"></path>
      </svg>
    </button>


    <!-- Menu -->

    <button class="header-btn" id="menuBtn" aria-label="Меню">
      <svg class="icon" viewBox="0 0 24 24">
        <path d="M4 6h16M4 12h16M4 18h16"></path>
      </svg>
    </button>

  </div>

</header>


<!-- =========================
     MOBILE MENU
========================= -->

<div class="mobile-menu" id="mobileMenu">

  <button data-menu="map">Карта</button>
  <button data-menu="regions">Регионы</button>
  <button data-menu="3d">3D</button>

<nav class="nav">

  <!-- 3D -->

<!-- =========================

========================= -->

<section class="layer-panel">

  <!-- Radar -->

  <div class="layer-row">

  <!-- Осадки -->

  <div class="layer-row">

        <path d="M17 10c0 2-3 3-3 5a3 3 0 0 0 6 0c0-2-3-3-3-5z"></path>

<section class="data-strip">

  </div>

     ALERT
========================= -->

<div class="alert" id="alert">

  <div class="alert-icon">

    <svg class="icon" viewBox="0 0 24 24">
      <path d="M12 3l10 18H2L12 3z"></path>

    <div class="alert-title">Предупреждения</div>

<!-- =========================
     SETTINGS
========================= -->

<div class="settings" id="settings">

  <div class="settings-title">Настройки</div>

  <button data-theme-choice="dark" class="active">

  </button>

    Светлая тема
  </button>

  <button id="movementBtn">
    Движение карты: включено
  </button>

</div>


<!-- =========================
     TIMELINE
========================= -->

<section class="timeline">

  <div class="timeline-top">

    <div class="timeline-now" id="timeText">
      СЕЙЧАС 17:22
    </div>

    <div class="timeline-date">
      13 СЕНТЯБРЯ
    </div>

  </div>


  <div class="timeline-main">

    <!-- Play -->

    <button class="time-btn" id="playBtn">

      <svg class="icon" viewBox="0 0 24 24">
        <path d="M8 5l11 7-11 7V5z"></path>
      </svg>

    </button>


    <!-- Pause -->

    <button class="time-btn dark" id="pauseBtn">

      <svg class="icon" viewBox="0 0 24 24">
        <path d="M8 6v12M16 6v12"></path>
      </svg>

    </button>


    <!-- Previous -->

    <button class="time-btn dark" id="prevBtn">

      <svg class="icon" viewBox="0 0 24 24">
        <path d="M18 6l-8 6 8 6M6 6v12"></path>
      </svg>

    </button>


    <!-- Slider -->

    <div class="slider-area">

      <div class="speed">

        <button class="speed-btn active" data-speed="1">
          1x
        </button>

        <button class="speed-btn" data-speed="2">
          2x
        </button>

      </div>


      <input
        class="timeline-range"
        id="timelineRange"
        type="range"
        min="0"
        max="100"
        value="70"
      >

      <div class="time-labels">

        <span>06:00</span>
        <span>08:00</span>
        <span>10:00</span>
        <span>12:00</span>
        <span>14:00</span>
        <span>16:00</span>
        <span>17:20</span>
        <span>18:00</span>
        <span>20:00</span>
        <span>22:00</span>

      </div>

    </div>


    <!-- Next -->

    <button class="time-btn dark" id="nextBtn">

      <svg class="icon" viewBox="0 0 24 24">
        <path d="M6 6l8 6-8 6M18 6v12"></path>
      </svg>

    </button>

  </div>

</section>


<!-- =========================
     TOAST
========================= -->

<div class="toast" id="toast"></div>


<!-- =========================
     LEAFLET
========================= -->

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>


<script>

/* =========================
   MAP
========================= */

const map=L.map("map",{
  zoomControl:false,
  attributionControl:true,
  minZoom:2,
  maxZoom:18
}).setView([55.75,37.62],5);


/* =========================
   DARK MAP
========================= */

L.tileLayer(
  "https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}",
  {
    maxZoom:18,
    attribution:"© Esri © OpenStreetMap"
  }
).addTo(map);


/* =========================
   ELEMENTS
========================= */

const $=id=>document.getElementById(id);

const toast=$("toast");
const searchBox=$("searchBox");
const searchInput=$("searchInput");
const searchResult=$("searchResult");
const mobileMenu=$("mobileMenu");
const settings=$("settings");


/* =========================
   TOAST
========================= */

let toastTimer;

function showToast(text){

  toast.textContent=text;
  toast.classList.add("show");

  clearTimeout(toastTimer);

  toastTimer=setTimeout(()=>{
    toast.classList.remove("show");
  },1800);
}


/* =========================
   MAP ZOOM
========================= */

$("zoomIn").onclick=()=>{
  map.zoomIn();
};

$("zoomOut").onclick=()=>{
  map.zoomOut();
};


/* =========================
   LOCATION
========================= */

$("locateBtn").onclick=()=>{

  if(!navigator.geolocation){
    showToast("Геолокация недоступна");
    return;
  }

  showToast("Определяем местоположение…");

  navigator.geolocation.getCurrentPosition(
    p=>{
      const lat=p.coords.latitude;
      const lon=p.coords.longitude;

      map.setView([lat,lon],9);

      L.circleMarker([lat,lon],{
        radius:7,
        color:"#fff",
        weight:2,
        fillColor:"#54e7a1",
        fillOpacity:1
      }).addTo(map);

      showToast("Местоположение найдено");
    },
    ()=>{
      showToast("Не удалось получить местоположение");
    }
  );
};


/* =========================
   SEARCH
========================= */

$("searchBtn").onclick=()=>{

  searchBox.classList.toggle("open");

  if(searchBox.classList.contains("open")){
    searchInput.focus();
  }
};

const cities={
  "москва":[55.7558,37.6173],
  "уфа":[54.7388,55.9721],
  "казань":[55.7879,49.1233],
  "самара":[53.1959,50.1002],
  "екатеринбург":[56.8389,60.6057],
  "нижний новгород":[56.3269,44.0059],
  "пермь":[58.0105,56.2502],
  "омск":[54.9885,73.3242],
  "новосибирск":[55.0084,82.9357],
  "челябинск":[55.1644,61.4368],
  "волгоград":[48.708,44.5133],
  "архангельск":[64.5399,40.5158]
};

searchInput.addEventListener("input",()=>{

  const q=searchInput.value.trim().toLowerCase();

  if(!q){
    searchResult.style.display="none";
    return;
  }

  const key=Object.keys(cities).find(x=>x.includes(q));

  if(!key){

    searchResult.textContent="Ничего не найдено";
    searchResult.style.display="block";
    return;
  }

  searchResult.textContent=
    key.charAt(0).toUpperCase()+key.slice(1);

  searchResult.style.display="block";

  searchResult.onclick=()=>{

    map.setView(cities[key],8);

    searchBox.classList.remove("open");
    searchResult.style.display="none";
    searchInput.value="";

    showToast(
      key.charAt(0).toUpperCase()+key.slice(1)
    );
  };

});


/* =========================
   MOBILE MENU
========================= */

$("menuBtn").onclick=()=>{

  mobileMenu.classList.toggle("open");

  settings.classList.remove("open");
  searchBox.classList.remove("open");
};


/* =========================
   NAVIGATION
========================= */

document.querySelectorAll(".nav-item").forEach(btn=>{

  btn.onclick=()=>{

    document.querySelectorAll(".nav-item")
      .forEach(x=>x.classList.remove("active"));

    btn.classList.add("active");

    const tab=btn.dataset.tab;

    if(tab==="map"){
      showToast("Карта");
    }else{
      showToast(btn.innerText.trim());
    }
  };

});


/* =========================
   MOBILE MENU ACTIONS
========================= */

document.querySelectorAll(".mobile-menu button")
.forEach(btn=>{

  btn.onclick=()=>{

    mobileMenu.classList.remove("open");

    const type=btn.dataset.menu;

    if(type==="layers"){
      showToast("Слои");
      return;
    }

    showToast(btn.textContent);
  };

});


/* =========================
   LAYERS
========================= */

document.querySelectorAll(".switch").forEach(sw=>{

  sw.onclick=()=>{

    sw.classList.toggle("on");

    const state=sw.classList.contains("on");
    const name=sw.parentElement
      .querySelector(".layer-name")
      .textContent;

    showToast(
      name+(state?" включён":" выключен")
    );
  };

});


/* =========================
   SETTINGS
========================= */

$("themeBtn").onclick=()=>{

  settings.classList.toggle("open");

  mobileMenu.classList.remove("open");
};


/* =========================
   THEME
========================= */

document.querySelectorAll("[data-theme-choice]")
.forEach(btn=>{

  btn.onclick=()=>{

    const theme=btn.dataset.themeChoice;

    document.body.classList.toggle(
      "light",
      theme==="light"
    );

    document.querySelectorAll("[data-theme-choice]")
      .forEach(x=>x.classList.remove("active"));

    btn.classList.add("active");

    showToast(
      theme==="light"
      ?"Светлая тема"
      :"Тёмная тема"
    );
  };

});


/* =========================
   MOVEMENT
========================= */

let movement=true;

$("movementBtn").onclick=()=>{

  movement=!movement;

  map.dragging[movement?"enable":"disable"]();

  $("movementBtn").textContent=
    "Движение карты: "+
    (movement?"включено":"выключено");

  showToast(
    movement
    ?"Движение включено"
    :"Движение выключено"
  );
};


/* =========================
   NOTIFICATIONS
========================= */

$("notifyBtn").onclick=()=>{

  $("alert").classList.add("show");

  showToast("Уведомления");
};


/* =========================
   ALERT CLOSE
========================= */

$("alertClose").onclick=()=>{

  $("alert").classList.remove("show");

};


/* =========================
   TIMELINE
========================= */

const range=$("timelineRange");

let playing=false;
let speed=1;
let timer=null;


function updateTime(){

  const value=Number(range.value);

  const start=6*60;
  const end=22*60;

  const minutes=Math.round(
    start+(end-start)*(value/100)
  );

  const h=Math.floor(minutes/60);
  const m=minutes%60;

  $("timeText").textContent=
    "СЕЙЧАС "+
    String(h).padStart(2,"0")+
    ":"+
    String(m).padStart(2,"0");
}


range.oninput=updateTime;


/* =========================
   PLAY
========================= */

function play(){

  if(playing)return;

  playing=true;

  timer=setInterval(()=>{

    let value=Number(range.value)+speed;

    if(value>100){
      value=0;
    }

    range.value=value;

    updateTime();

  },350);
}


function pause(){

  playing=false;

  clearInterval(timer);
  timer=null;
}


$("playBtn").onclick=()=>{
  play();
  showToast("Воспроизведение");
};


$("pauseBtn").onclick=()=>{
  pause();
  showToast("Пауза");
};


/* =========================
   PREVIOUS
========================= */

$("prevBtn").onclick=()=>{

  pause();

  range.value=Math.max(
    0,
    Number(range.value)-5
  );

  updateTime();
};


/* =========================
   NEXT
========================= */

$("nextBtn").onclick=()=>{

  pause();

  range.value=Math.min(
    100,
    Number(range.value)+5
  );

  updateTime();
};


/* =========================
   SPEED
========================= */

document.querySelectorAll(".speed-btn")
.forEach(btn=>{

  btn.onclick=()=>{

    speed=Number(btn.dataset.speed);

    document.querySelectorAll(".speed-btn")
      .forEach(x=>x.classList.remove("active"));

    btn.classList.add("active");

    showToast(speed+"x");
  };

});


/* =========================
   INITIAL
========================= */

updateTime();


/* =========================
   CLOSE POPUPS
========================= */

map.on("click",()=>{

  searchBox.classList.remove("open");
  mobileMenu.classList.remove("open");

});


/* =========================
   KEYBOARD
========================= */

document.addEventListener("keydown",e=>{

  if(e.key==="Escape"){

    searchBox.classList.remove("open");
    mobileMenu.classList.remove("open");
    settings.classList.remove("open");
    $("alert").classList.remove("show");

  }

});


/* =========================
   RESIZE
========================= */

window.addEventListener("resize",()=>{
  map.invalidateSize();
});


</script>

</body>
</html>
