<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>CLOrad</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  background:#151b20;
  color:#e9edef;
}

body.light{
  background:#f0f3f5;
  color:#182026;
}

#map{
  position:fixed;
  inset:0;
  z-index:1;
}

.leaflet-container{
  background:#dfe5e8;
}

.leaflet-control-attribution{
  font-size:9px;
}

/* =========================
   RADAR CANVAS
========================= */

#radarCanvas{
  position:fixed;
  inset:0;
  z-index:450;
  pointer-events:none;
  width:100%;
  height:100%;
}

/* =========================
   HEADER
========================= */

.header{
  position:fixed;
  left:0;
  right:0;
  top:0;
  height:80px;
  z-index:1000;

  display:flex;
  align-items:center;

  padding:0 14px;

  background:#151b20;
  border-bottom:1px solid #303940;
}

body.light .header{
  background:#f7f9fa;
  border-bottom:1px solid #ccd3d8;
}

.logo{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:21px;
  font-weight:700;
  letter-spacing:.2px;
}

.radarLogo{
  width:39px;
  height:39px;
  border-radius:50%;
  background:#222b31;
  display:flex;
  align-items:center;
  justify-content:center;
}

.radarLogo svg{
  width:25px;
  height:25px;
  fill:none;
  stroke:#bfc7cc;
  stroke-width:1.8;
}

.headerButtons{
  margin-left:auto;
  display:flex;
  align-items:center;
  gap:7px;
}

.iconBtn{
  width:48px;
  height:48px;
  border:0;
  border-radius:11px;
  background:#222a30;
  color:#dfe5e8;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
}

.iconBtn:active{
  transform:scale(.96);
}

.iconBtn svg{
  width:23px;
  height:23px;
  fill:none;
  stroke:currentColor;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round;
}

body.light .iconBtn{
  background:#e4e9ec;
  color:#1d252a;
}

/* =========================
   TOP NAV
========================= */

.topNav{
  position:fixed;
  left:0;
  right:0;
  top:80px;
  height:48px;

  z-index:990;

  display:none;
  align-items:center;

  background:#181f24;
  border-bottom:1px solid #303940;

  overflow-x:auto;
  overflow-y:hidden;

  touch-action:pan-x;
  overscroll-behavior-x:contain;
  overscroll-behavior-y:none;

  -webkit-overflow-scrolling:touch;
}

.topNav.open{
  display:flex;
}

.topNav::-webkit-scrollbar{
  display:none;
}

.navInner{
  display:flex;
  min-width:max-content;
  height:100%;
  align-items:center;
  padding:0 8px;
}

.navItem{
  height:100%;
  padding:0 16px;

  display:flex;
  align-items:center;
  justify-content:center;
  gap:7px;

  color:#aeb8bd;
  font-size:14px;
  font-weight:600;

  border:0;
  background:none;

  white-space:nowrap;
}

.navItem.active{
  color:#00c853;
}

.navItem svg{
  width:18px;
  height:18px;

  fill:none;
  stroke:currentColor;
  stroke-width:1.7;
  stroke-linecap:round;
  stroke-linejoin:round;
}

/* =========================
   SEARCH
========================= */

.popup{
  position:fixed;
  z-index:1200;

  background:#20282e;
  border:1px solid #39444b;
  border-radius:11px;

  box-shadow:0 12px 35px rgba(0,0,0,.45);
}

.search{
  right:12px;
  top:88px;
  width:320px;
  padding:9px;
}

.searchInput{
  width:100%;
  height:42px;

  border:1px solid #465158;
  border-radius:8px;

  background:#151b20;
  color:#e9edef;

  outline:none;

  padding:0 12px;
  font-size:14px;
}

.searchResults{
  margin-top:7px;
}

.searchResult{
  width:100%;
  border:0;
  border-radius:8px;

  background:transparent;
  color:#dce2e5;

  padding:11px;
  text-align:left;

  font-size:14px;
}

.searchResult:active{
  background:#303a41;
}

/* =========================
   SETTINGS
========================= */

.settings{
  right:12px;
  top:88px;
  width:320px;

  padding:8px;

  max-height:calc(100vh - 105px);
  overflow:auto;
}

.settingsTitle{
  font-size:17px;
  font-weight:700;

  padding:9px 8px 10px;
}

.settingSection{
  border:1px solid #3b4650;
  border-radius:9px;
  overflow:hidden;

  background:#202930;
}

.settingHead{
  width:100%;
  min-height:52px;

  border:0;
  background:none;
  color:#e9edef;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:0 12px;

  font-size:15px;
  text-align:left;
}

.settingHead .arrow{
  font-size:18px;
  transition:transform .2s;
}

.settingSection.open .settingHead .arrow{
  transform:rotate(90deg);
}

.settingBody{
  display:none;
  padding:0 12px 12px;
}

.settingSection.open .settingBody{
  display:block;
}

.framesInfo{
  font-size:12px;
  color:#9da8ae;
  margin-bottom:9px;
}

.frameControls{
  display:flex;
  align-items:center;
  gap:7px;
}

.frameButton{
  width:42px;
  height:38px;

  border:1px solid #465158;
  border-radius:8px;

  background:#151b20;
  color:#e9edef;

  font-size:20px;
  font-weight:500;
}

.frameInput{
  flex:1;

  min-width:0;
  height:38px;

  border:1px solid #465158;
  border-radius:8px;

  background:#151b20;
  color:#fff;

  text-align:center;
  font-size:15px;
  outline:none;
}

body.light .settings,
body.light .popup{
  background:#f7f9fa;
  border-color:#ccd3d8;
}

body.light .settingSection{
  background:#eef2f4;
  border-color:#ccd3d8;
}

body.light .settingHead{
  color:#1d252a;
}

body.light .frameInput,
body.light .frameButton,
body.light .searchInput{
  background:#fff;
  color:#182026;
  border-color:#c6ced3;
}

/* =========================
   LAYERS
========================= */

.layers{
  position:fixed;

  right:12px;
  top:140px;

  width:190px;

  z-index:900;

  padding:9px;

  background:#20282e;
  border:1px solid #39444b;
  border-radius:10px;

  box-shadow:0 12px 35px rgba(0,0,0,.4);
}

.layer{
  display:grid;
  grid-template-columns:27px minmax(0,1fr) 46px;
  align-items:center;

  gap:7px;

  min-height:48px;
}

.layerIcon{
  width:25px;
  height:25px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.layerIcon svg{
  width:22px;
  height:22px;
  fill:none;
  stroke:#d7dee2;
  stroke-width:1.7;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.layer span{
  font-size:13px;
  line-height:15px;
  color:#d9e0e3;
}

.switch{
  position:relative;

  width:46px;
  height:26px;

  border-radius:20px;
  border:1px solid #465158;

  background:#303940;

  cursor:pointer;
}

.switch::after{
  content:"";

  position:absolute;

  width:20px;
  height:20px;

  top:2px;
  left:2px;

  border-radius:50%;

  background:#b8c0c5;

  transition:.18s;
}

.switch.on{
  background:#00a94f;
  border-color:#00a94f;
}

.switch.on::after{
  left:22px;
  background:#fff;
}

/* =========================
   MAP CONTROLS
========================= */

.mapControls{
  position:fixed;

  left:12px;
  top:112px;

  z-index:800;

  display:flex;
  flex-direction:column;
  gap:7px;
}

.mapBtn{
  width:56px;
  height:56px;

  border:0;
  border-radius:11px;

  background:#20282e;
  color:#dce3e6;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:28px;
}

.mapBtn:active{
  transform:scale(.96);
}

.mapBtn svg{
  width:23px;
  height:23px;

  fill:currentColor;
  stroke:none;
}

/* =========================
   LEGEND
========================= */

.legendTab{
  position:fixed;

  right:0;
  top:50%;

  transform:translateY(-50%);

  width:32px;
  height:100px;

  z-index:850;

  border:0;
  border-radius:9px 0 0 9px;

  background:#20282e;
  color:#dfe5e8;

  font-size:19px;
}

.legend{
  position:fixed;

  right:0;
  top:50%;

  transform:translateY(-50%);

  width:220px;

  z-index:1000;

  background:#20282e;
  border:1px solid #39444b;

  border-radius:10px 0 0 10px;

  padding:13px;

  display:none;

  box-shadow:0 10px 30px rgba(0,0,0,.45);
}

.legend.open{
  display:block;
}

.legendHeader{
  display:flex;
  align-items:center;
  justify-content:space-between;

  margin-bottom:10px;

  font-size:15px;
  font-weight:700;
}

.legendClose{
  border:0;
  background:none;
  color:#dce3e6;
  font-size:22px;
}

.legendRow{
  display:flex;
  align-items:center;
  gap:8px;

  margin:5px 0;

  font-size:12px;
}

.legendColor{
  width:27px;
  height:13px;
  border-radius:2px;
}

/* =========================
   BOTTOM CARD
========================= */

.bottom{
  position:fixed;

  left:50%;
  bottom:12px;

  transform:translateX(-50%);

  z-index:800;

  width:min(650px,calc(100% - 24px));
}

.dataCard{
  min-height:61px;

  background:#20282e;
  border:1px solid #39444b;

  border-radius:11px;

  padding:9px 12px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  gap:12px;

  box-shadow:0 10px 30px rgba(0,0,0,.3);
}

.dataMain{
  min-width:0;
}

.dataTitle{
  font-size:13px;
  font-weight:700;
}

.dataValue{
  margin-top:3px;
  font-size:12px;
  color:#aab5bb;
}

.dataRight{
  text-align:right;
  font-size:11px;
  color:#aab5bb;
  white-space:nowrap;
}

/* =========================
   TIMELINE
========================= */

.timeline{
  margin-top:7px;

  height:58px;

  background:#20282e;
  border:1px solid #39444b;

  border-radius:11px;

  display:flex;
  align-items:center;

  padding:7px 10px;

  gap:9px;
}

.playBtn{
  flex:0 0 auto;

  width:42px;
  height:42px;

  border:0;
  border-radius:9px;

  background:#303a41;
  color:#e7ecef;

  font-size:17px;
}

.rangeWrap{
  flex:1;
  min-width:0;
}

input[type="range"]{
  width:100%;
  accent-color:#00c853;
}

.timeText{
  margin-top:1px;

  font-size:10px;
  color:#9da8ae;

  text-align:center;
}

/* =========================
   LOADING
========================= */

.loading{
  position:fixed;

  left:50%;
  top:50%;

  transform:translate(-50%,-50%);

  z-index:1500;

  padding:12px 16px;

  border-radius:10px;

  background:rgba(25,32,37,.94);
  border:1px solid #3d474e;

  color:#dfe5e8;

  font-size:13px;

  display:none;
}

.loading.show{
  display:block;
}

/* =========================
   MOBILE
========================= */

@media(max-width:600px){

  .header{
    height:72px;
  }

  .topNav{
    top:72px;
  }

  .logo{
    font-size:19px;
  }

  .headerButtons{
    gap:4px;
  }

  .iconBtn{
    width:43px;
    height:43px;
  }

  .mapControls{
    top:88px;
  }

  .layers{
    top:130px;
  }

  .search,
  .settings{
    top:80px;
    right:8px;
    width:calc(100vw - 16px);
  }

  .dataCard{
    min-height:58px;
  }
}
</style>
</head>

<body>

<div id="map"></div>

<canvas id="radarCanvas"></canvas>

<!-- =========================
     HEADER
========================= -->

<header class="header">

  <div class="logo">

    <div class="radarLogo">
      <svg viewBox="0 0 32 32">
        <circle cx="16" cy="16" r="11"/>
        <circle cx="16" cy="16" r="6"/>
        <path d="M16 16 24 8"/>
        <path d="M5 16h22"/>
        <path d="M16 5v22"/>
      </svg>
    </div>

    <span>CLOrad</span>

  </div>

  <div class="headerButtons">

    <!-- SEARCH -->

    <button class="iconBtn" id="searchBtn" aria-label="Поиск">
      <svg viewBox="0 0 24 24">
        <circle cx="11" cy="11" r="6.5"/>
        <path d="m16 16 5 5"/>
      </svg>
    </button>

    <!-- THEME -->

    <button class="iconBtn" id="themeBtn" aria-label="Тема">
      <svg viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.65 17.65l1.42 1.42M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.65 6.35l1.42-1.42"/>
      </svg>
    </button>

    <!-- SETTINGS -->

    <button class="iconBtn" id="settingsBtn" aria-label="Настройки">
      <svg viewBox="0 0 24 24">
        <path d="M12 8.2a3.8 3.8 0 1 0 0 7.6 3.8 3.8 0 0 0 0-7.6Z"/>
        <path d="m19.4 15 .1.1a1.8 1.8 0 0 1-2.5 2.5l-.1-.1a1.8 1.8 0 0 0-3.1 1.1v.2a1.8 1.8 0 0 1-3.6 0v-.2a1.8 1.8 0 0 0-3.1-1.1l-.1.1a1.8 1.8 0 0 1-2.5-2.5l.1-.1a1.8 1.8 0 0 0-1.1-3.1h-.2a1.8 1.8 0 0 1 0-3.6h.2a1.8 1.8 0 0 0 1.1-3.1l-.1-.1a1.8 1.8 0 0 1 2.5-2.5l.1.1a1.8 1.8 0 0 0 3.1-1.1v-.2a1.8 1.8 0 0 1 3.6 0v.2a1.8 1.8 0 0 0 3.1 1.1l.1-.1a1.8 1.8 0 0 1 2.5 2.5l-.1.1a1.8 1.8 0 0 0 1.1 3.1h.2a1.8 1.8 0 0 1 0 3.6h-.2a1.8 1.8 0 0 0-1.1 3.1Z"/>
      </svg>
    </button>

    <!-- MENU -->

    <button class="iconBtn" id="menuBtn" aria-label="Меню">
      <svg viewBox="0 0 24 24">
        <path d="M4 7h16M4 12h16M4 17h16"/>
      </svg>
    </button>

  </div>

</header>

<!-- =========================
     TOP NAV
========================= -->

<nav class="topNav" id="topNav">

  <div class="navInner">

    <button class="navItem active">
      Карта
    </button>

    <button class="navItem">
      <svg viewBox="0 0 24 24">
        <path d="M4 5 10 3l5 2 5-2v16l-5 2-5-2-6 2Z"/>
        <path d="M10 3v16M15 5v16"/>
      </svg>
      Регионы
    </button>

    <button class="navItem">
      3D
    </button>

    <button class="navItem">
      Предупр.
    </button>

    <button class="navItem">
      Архив
    </button>

    <button class="navItem">
      Аналитика
    </button>

    <button class="navItem active" id="layersNav">
      Слои
    </button>

  </div>

</nav>

<!-- =========================
     SEARCH
========================= -->

<div class="popup search" id="searchPopup" style="display:none">

  <input
    id="searchInput"
    class="searchInput"
    placeholder="Поиск города..."
    autocomplete="off"
  >

  <div class="searchResults">

    <button class="searchResult" data-lat="54.7388" data-lon="55.9721">
      Уфа
    </button>

    <button class="searchResult" data-lat="55.7558" data-lon="37.6173">
      Москва
    </button>

    <button class="searchResult" data-lat="59.9343" data-lon="30.3351">
      Санкт-Петербург
    </button>

    <button class="searchResult" data-lat="56.8389" data-lon="60.6057">
      Екатеринбург
    </button>

    <button class="searchResult" data-lat="55.0415" data-lon="82.9346">
      Новосибирск
    </button>

  </div>

</div>

<!-- =========================
     SETTINGS
========================= -->

<div class="popup settings" id="settingsPopup" style="display:none">

  <div class="settingsTitle">
    Настройки
  </div>

  <div class="settingSection" id="framesSection">

    <button class="settingHead" id="framesHead">

      <span>Кол. кадров</span>

      <span class="arrow">›</span>

    </button>

    <div class="settingBody">

      <div class="framesInfo" id="framesInfo">
        Получение данных Nowcast...
      </div>

      <div class="frameControls">

        <button class="frameButton" id="frameMinus">
          −
        </button>

        <input
          id="frameInput"
          class="frameInput"
          type="number"
          min="1"
          value="24"
        >

        <button class="frameButton" id="framePlus">
          +
        </button>

      </div>

    </div>

  </div>

</div>

<!-- =========================
     LAYERS
========================= -->

<div class="layers" id="layersPanel">

  <div class="layer">

    <div class="layerIcon">
      <svg viewBox="0 0 24 24">
        <path d="M12 3 3 8l9 5 9-5-9-5Z"/>
        <path d="m3 12 9 5 9-5"/>
        <path d="m3 16 9 5 9-5"/>
      </svg>
    </div>

    <span>Опасные явления</span>

    <button class="switch" aria-label="Опасные явления"></button>

  </div>

  <div class="layer">

    <div class="layerIcon">
      <svg viewBox="0 0 24 24">
        <path d="M12 3v18"/>
        <path d="M3 12h18"/>
        <path d="M5 5l14 14"/>
        <path d="M19 5 5 19"/>
      </svg>
    </div>

    <span>Отражаемость</span>

    <button
      class="switch on"
      id="reflectivitySwitch"
      aria-label="Отражаемость"
    ></button>

  </div>

  <div class="layer">

    <div class="layerIcon">
      <svg viewBox="0 0 24 24">
        <path d="M13 2 5 13h6l-1 9 8-12h-6l1-8Z"/>
      </svg>
    </div>

    <span>Молнии</span>

    <button class="switch" aria-label="Молнии"></button>

  </div>

</div>

<!-- =========================
     MAP CONTROLS
========================= -->

<div class="mapControls">

  <button class="mapBtn" id="zoomIn">
    +
  </button>

  <button class="mapBtn" id="zoomOut">
    −
  </button>

  <button class="mapBtn" id="locateBtn" aria-label="Местоположение">

    <svg viewBox="0 0 24 24">
      <path d="M20.2 3.8 4.1 10.7c-.72.31-.67 1.35.08 1.57l6.05 1.76 1.76 6.05c.22.75 1.26.8 1.57.08l6.91-16.1c.29-.67-.27-1.23-.94-.94Z"/>
    </svg>

  </button>

</div>

<!-- =========================
     LEGEND
========================= -->

<button class="legendTab" id="legendTab">
  ‹
</button>

<div class="legend" id="legend">

  <div class="legendHeader">

    <span>Отражаемость, dBZ</span>

    <button class="legendClose" id="legendClose">
      ×
    </button>

  </div>

  <div class="legendRow">
    <span class="legendColor" style="background:#00b7ff"></span>
    5–10
  </div>

  <div class="legendRow">
    <span class="legendColor" style="background:#0087ff"></span>
    10–15
  </div>

  <div class="legendRow">
    <span class="legendColor" style="background:#00e5ff"></span>
    15–20
  </div>

  <div class="legendRow">
    <span class="legendColor" style="background:#00ff66"></span>
    20–25
  </div>

  <div class="legendRow">
    <span class="legendColor" style="background:#00c853"></span>
    25–30
  </div>

  <div class="legendRow">
    <span class="legendColor" style="background:#a8e600"></span>
    30–35
  </div>

  <div class="legendRow">
    <span class="legendColor" style="background:#ffe600"></span>
    35–40
  </div>

  <div class="legendRow">
    <span class="legendColor" style="background:#ffb300"></span>
    40–45
  </div>

  <div class="legendRow">
    <span class="legendColor" style="background:#ff6d00"></span>
    45–50
  </div>

  <div class="legendRow">
    <span class="legendColor" style="background:#ff2d2d"></span>
    50–55
  </div>

  <div class="legendRow">
    <span class="legendColor" style="background:#d50000"></span>
    55–60
  </div>

  <div class="legendRow">
    <span class="legendColor" style="background:#8e24aa"></span>
    &gt;60
  </div>

</div>

<!-- =========================
     BOTTOM
========================= -->

<div class="bottom">

  <div class="dataCard">

    <div class="dataMain">

      <div class="dataTitle">
        ОТРАЖАЕМОСТЬ
      </div>

      <div class="dataValue" id="dataValue">
        Нет данных
      </div>

    </div>

    <div class="dataRight">

      <div>
        ГРОЗА —
      </div>

      <div>
        СКОРОСТЬ: —
      </div>

    </div>

  </div>

  <div class="timeline">

    <button class="playBtn" id="playBtn">
      ▶
    </button>

    <div class="rangeWrap">

      <input
        type="range"
        id="timeRange"
        min="0"
        max="0"
        value="0"
      >

      <div class="timeText" id="timeText">
        Загрузка...
      </div>

    </div>

  </div>

</div>

<div class="loading" id="loading">
  Загрузка отражаемости…
</div>

<script>
/* =========================================================
   LEAFLET
========================================================= */

let map = null;
let tiles = null;

function loadLeaflet(){
  return new Promise((resolve,reject)=>{

    if(window.L){
      resolve();
      return;
    }

    const script = document.createElement("script");

    script.src =
      "https://unpkg.com/leaflet@1.9.4/dist/leaflet.js";

    script.onload = resolve;

    script.onerror = ()=>{

      const fallback = document.createElement("script");

      fallback.src =
        "https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js";

      fallback.onload = resolve;
      fallback.onerror = reject;

      document.head.appendChild(fallback);
    };

    document.head.appendChild(script);
  });
}

function initMap(){

  if(!window.L || map) return;

  map = L.map("map",{
    zoomControl:false,
    attributionControl:true,
    preferCanvas:false
  }).setView([55.75,37.62],5);

  tiles = L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
      maxZoom:19,
      minZoom:2,

      attribution:"© OpenStreetMap",

      updateWhenZooming:false,
      updateWhenIdle:true,
      keepBuffer:2
    }
  ).addTo(map);

  setTimeout(()=>{
    map.invalidateSize();
    redrawRadar();
  },100);

  setTimeout(()=>{
    map.invalidateSize();
    redrawRadar();
  },700);

  map.on("move zoom resize",()=>{
    redrawRadar();
  });
}

/* =========================================================
   CANVAS
========================================================= */

const radarCanvas =
  document.getElementById("radarCanvas");

const ctx =
  radarCanvas.getContext("2d");

let radarVisible = true;

function resizeCanvas(){

  const dpr =
    Math.max(1,window.devicePixelRatio || 1);

  radarCanvas.width =
    Math.round(window.innerWidth * dpr);

  radarCanvas.height =
    Math.round(window.innerHeight * dpr);

  radarCanvas.style.width =
    window.innerWidth + "px";

  radarCanvas.style.height =
    window.innerHeight + "px";

  ctx.setTransform(
    dpr,0,0,dpr,0,0
  );

  redrawRadar();
}

window.addEventListener(
  "resize",
  resizeCanvas
);

resizeCanvas();

/* =========================================================
   COLORS
========================================================= */

function dbzColor(value){

  if(value == null || !Number.isFinite(value))
    return null;

  if(value < 5)
    return null;

  if(value < 10) return "#00b7ff";
  if(value < 15) return "#0087ff";
  if(value < 20) return "#00e5ff";
  if(value < 25) return "#00ff66";
  if(value < 30) return "#00c853";
  if(value < 35) return "#a8e600";
  if(value < 40) return "#ffe600";
  if(value < 45) return "#ffb300";
  if(value < 50) return "#ff6d00";
  if(value < 55) return "#ff2d2d";
  if(value < 60) return "#d50000";

  return "#8e24aa";
}

/* =========================================================
   FRAME STORAGE
========================================================= */

let allTimes = [];
let frames = [];
let frameData = new Map();

let frameCount = 24;
let currentFrame = 0;

let loadingFrames = false;

const timeRange =
  document.getElementById("timeRange");

const timeText =
  document.getElementById("timeText");

const dataValue =
  document.getElementById("dataValue");

const framesInfo =
  document.getElementById("framesInfo");

const frameInput =
  document.getElementById("frameInput");

const loading =
  document.getElementById("loading");

/* =========================================================
   NORMALIZE NOWCAST DATA
========================================================= */

function extractPoints(raw){

  let source = raw;

  if(raw && Array.isArray(raw.data)){
    source = raw.data;
  }

  if(
    raw &&
    raw.data &&
    raw.data.data &&
    Array.isArray(raw.data.data)
  ){
    source = raw.data.data;
  }

  const result = [];

  function addPoint(a){

    if(!Array.isArray(a))
      return;

    if(a.length < 3)
      return;

    let a0 = Number(a[0]);
    let a1 = Number(a[1]);
    let value = Number(a[2]);

    if(
      !Number.isFinite(a0) ||
      !Number.isFinite(a1) ||
      !Number.isFinite(value)
    ){
      return;
    }

    let lat = a0;
    let lon = a1;

    /*
     * Поддержка обоих вариантов:
     * [lat,lon,value]
     * [lon,lat,value]
     */

    if(
      Math.abs(lat) > 90 &&
      Math.abs(lon) <= 90
    ){
      lat = a1;
      lon = a0;
    }

    if(
      Math.abs(lat) <= 90 &&
      Math.abs(lon) <= 180
    ){

      result.push({
        lat,
        lon,
        value
      });

    }
  }

  function walk(value){

    if(Array.isArray(value)){

      if(
        value.length >= 3 &&
        typeof value[0] !== "object"
      ){
        addPoint(value);
        return;
      }

      for(const item of value){
        walk(item);
      }

      return;
    }

    if(value && typeof value === "object"){

      const lat =
        Number(
          value.lat ??
          value.latitude ??
          value.y
        );

      const lon =
        Number(
          value.lon ??
          value.lng ??
          value.longitude ??
          value.x
        );

      const dbz =
        Number(
          value.value ??
          value.dbz ??
          value.reflectivity ??
          value.z
        );

      if(
        Number.isFinite(lat) &&
        Number.isFinite(lon) &&
        Number.isFinite(dbz)
      ){

        result.push({
          lat,
          lon,
          value:dbz
        });

      }

      if(value.features){
        walk(value.features);
      }

      if(value.data){
        walk(value.data);
      }
    }
  }

  walk(source);

  return result;
}

/* =========================================================
   DRAW
========================================================= */

function redrawRadar(){

  ctx.clearRect(
    0,
    0,
    window.innerWidth,
    window.innerHeight
  );

  if(!radarVisible)
    return;

  if(!map)
    return;

  const time =
    frames[currentFrame];

  if(!time)
    return;

  const raw =
    frameData.get(time);

  if(!raw)
    return;

  const points =
    extractPoints(raw);

  if(!points.length)
    return;

  /*
   * Размер ячейки зависит от масштаба карты.
   */

  const zoom = map.getZoom();

  let size;

  if(zoom <= 4) size = 4;
  else if(zoom <= 5) size = 5;
  else if(zoom <= 6) size = 6;
  else if(zoom <= 7) size = 7;
  else if(zoom <= 8) size = 8;
  else size = 9;

  /*
   * Рисуем только реальные точки.
   * Никакого серого фона/маски.
   */

  for(const p of points){

    const color =
      dbzColor(p.value);

    if(!color)
      continue;

    const latlng =
      L.latLng(
        p.lat,
        p.lon
      );

    const pixel =
      map.latLngToContainerPoint(latlng);

    /*
     * Отбрасываем то, что далеко за экраном.
     */

    if(
      pixel.x < -size ||
      pixel.y < -size ||
      pixel.x > window.innerWidth + size ||
      pixel.y > window.innerHeight + size
    ){
      continue;
    }

    ctx.fillStyle = color;

    ctx.fillRect(
      Math.round(pixel.x - size / 2),
      Math.round(pixel.y - size / 2),
      size,
      size
    );
  }
}

/* =========================================================
   LOAD TIMES
========================================================= */

async function loadNowcastTimes(){

  try{

    const response =
      await fetch(
        "/api/radar?action=nowcast-times",
        {
          cache:"no-store"
        }
      );

    const json =
      await response.json();

    if(
      !json.ok ||
      !Array.isArray(json.times)
    ){
      throw new Error(
        json.message || "Нет времён"
      );
    }

    allTimes =
      json.times
        .map(String)
        .filter(Boolean);

    /*
     * Самый новый кадр последний.
     */

    allTimes.sort(
      (a,b)=>
        new Date(a) -
        new Date(b)
    );

    updateFramesInfo();

    await applyFrameCount();

  }catch(error){

    console.error(
      "Nowcast times:",
      error
    );

    framesInfo.textContent =
      "Не удалось получить список кадров";

    /*
     * Запасной массив.
     */

    const now = Date.now();

    allTimes = [];

    for(let i=143;i>=0;i--){

      allTimes.push(
        new Date(
          now -
          i * 10 * 60 * 1000
        ).toISOString()
      );

    }

    await applyFrameCount();
  }
}

/* =========================================================
   FRAME COUNT
========================================================= */

function updateFramesInfo(){

  framesInfo.textContent =
    `Доступно: ${allTimes.length}`;
}

function setFrameCount(value){

  value =
    parseInt(value,10);

  if(!Number.isFinite(value))
    value = 1;

  const max =
    Math.max(
      1,
      allTimes.length
    );

  value =
    Math.max(
      1,
      Math.min(
        value,
        max
      )
    );

  frameCount = value;

  frameInput.value =
    frameCount;

  applyFrameCount();
}

async function applyFrameCount(){

  if(!allTimes.length)
    return;

  const count =
    Math.min(
      frameCount,
      allTimes.length
    );

  /*
   * Берём последние N кадров.
   */

  frames =
    allTimes.slice(
      Math.max(
        0,
        allTimes.length - count
      )
    );

  /*
   * Начинаем с самого старого
   * из выбранных кадров.
   */

  currentFrame = 0;

  timeRange.min = 0;

  timeRange.max =
    Math.max(
      0,
      frames.length - 1
    );

  timeRange.value =
    currentFrame;

  updateTimeText();

  updateFramesInfo();

  await loadFrames();

  redrawRadar();
}

/* =========================================================
   LOAD RADAR FRAMES
========================================================= */

async function loadFrames(){

  if(loadingFrames)
    return;

  loadingFrames = true;

  loading.classList.add("show");

  /*
   * До 10 запросов одновременно.
   */

  const queue =
    frames.filter(
      t => !frameData.has(t)
    );

  let cursor = 0;

  async function worker(){

    while(true){

      const index =
        cursor++;

      if(index >= queue.length)
        return;

      const time =
        queue[index];

      try{

        const response =
          await fetch(
            "/api/radar?action=nowcast&time=" +
            encodeURIComponent(time),
            {
              cache:"force-cache"
            }
          );

        if(!response.ok)
          throw new Error(
            "HTTP " + response.status
          );

        const json =
          await response.json();

        if(json.ok){

          frameData.set(
            time,
            json.data
          );

        }

      }catch(error){

        console.warn(
          "Frame failed:",
          time,
          error
        );

      }

      /*
       * Если загружен текущий кадр —
       * сразу показать его.
       */

      if(
        time === frames[currentFrame]
      ){
        redrawRadar();
        updateDataCard();
      }
    }
  }

  const workers = [];

  for(
    let i=0;
    i<Math.min(10,queue.length);
    i++
  ){
    workers.push(
      worker()
    );
  }

  await Promise.all(workers);

  loadingFrames = false;

  loading.classList.remove("show");

  redrawRadar();

  updateDataCard();
}

/* =========================================================
   TIME UI
========================================================= */

function formatTime(time){

  if(!time)
    return "Нет данных";

  const d =
    new Date(time);

  if(Number.isNaN(d.getTime()))
    return time;

  return d.toLocaleString(
    "ru-RU",
    {
      day:"2-digit",
      month:"2-digit",
      hour:"2-digit",
      minute:"2-digit"
    }
  );
}

function updateTimeText(){

  const time =
    frames[currentFrame];

  timeText.textContent =
    time
      ? formatTime(time)
      : "Нет данных";
}

function getCurrentPoints(){

  const time =
    frames[currentFrame];

  if(!time)
    return [];

  const raw =
    frameData.get(time);

  if(!raw)
    return [];

  return extractPoints(raw);
}

function updateDataCard(){

  const points =
    getCurrentPoints();

  if(!points.length){

    dataValue.textContent =
      "Нет данных";

    return;
  }

  let max = -Infinity;

  for(const p of points){

    if(
      Number.isFinite(p.value) &&
      p.value > max
    ){
      max = p.value;
    }
  }

  if(max === -Infinity){

    dataValue.textContent =
      "Нет данных";

  }else{

    dataValue.textContent =
      `Максимум: ${max.toFixed(1)} dBZ`;
  }
}

timeRange.addEventListener(
  "input",
  ()=>{

    currentFrame =
      Number(
        timeRange.value
      );

    updateTimeText();
    updateDataCard();
    redrawRadar();
  }
);

/* =========================================================
   PLAY
========================================================= */

const playBtn =
  document.getElementById("playBtn");

let playing = false;
let playTimer = null;

function stopPlay(){

  playing = false;

  playBtn.textContent =
    "▶";

  if(playTimer){

    clearInterval(
      playTimer
    );

    playTimer = null;
  }
}

function startPlay(){

  if(frames.length < 2)
    return;

  playing = true;

  playBtn.textContent =
    "Ⅱ";

  playTimer =
    setInterval(()=>{

      currentFrame++;

      if(
        currentFrame >= frames.length
      ){
        currentFrame = 0;
      }

      timeRange.value =
        currentFrame;

      updateTimeText();
      updateDataCard();
      redrawRadar();

    },700);
}

playBtn.addEventListener(
  "click",
  ()=>{

    if(playing)
      stopPlay();
    else
      startPlay();

  }
);

/* =========================================================
   SETTINGS
========================================================= */

const settingsBtn =
  document.getElementById(
    "settingsBtn"
  );

const settingsPopup =
  document.getElementById(
    "settingsPopup"
  );

const framesSection =
  document.getElementById(
    "framesSection"
  );

const framesHead =
  document.getElementById(
    "framesHead"
  );

const frameMinus =
  document.getElementById(
    "frameMinus"
  );

const framePlus =
  document.getElementById(
    "framePlus"
  );

settingsBtn.addEventListener(
  "click",
  e=>{

    e.stopPropagation();

    const open =
      settingsPopup.style.display !== "none";

    settingsPopup.style.display =
      open ? "none" : "block";
  }
);

framesHead.addEventListener(
  "click",
  ()=>{

    framesSection.classList.toggle(
      "open"
    );
  }
);

frameMinus.addEventListener(
  "click",
  ()=>{
    setFrameCount(
      frameCount - 1
    );
  }
);

framePlus.addEventListener(
  "click",
  ()=>{
    setFrameCount(
      frameCount + 1
    );
  }
);

frameInput.addEventListener(
  "change",
  ()=>{
    setFrameCount(
      frameInput.value
    );
  }
);

/* =========================================================
   SEARCH
========================================================= */

const searchBtn =
  document.getElementById(
    "searchBtn"
  );

const searchPopup =
  document.getElementById(
    "searchPopup"
  );

const searchInput =
  document.getElementById(
    "searchInput"
  );

searchBtn.addEventListener(
  "click",
  e=>{

    e.stopPropagation();

    const open =
      searchPopup.style.display !== "none";

    searchPopup.style.display =
      open ? "none" : "block";

    settingsPopup.style.display =
      "none";

    if(!open){

      setTimeout(
        ()=>searchInput.focus(),
        50
      );
    }
  }
);

document
  .querySelectorAll(".searchResult")
  .forEach(button=>{

    button.addEventListener(
      "click",
      ()=>{

        const lat =
          Number(
            button.dataset.lat
          );

        const lon =
          Number(
            button.dataset.lon
          );

        if(map){

          map.setView(
            [lat,lon],
            8,
            {
              animate:true
            }
          );
        }

        searchPopup.style.display =
          "none";
      }
    );
  });

/* =========================================================
   THEME
========================================================= */

document
  .getElementById("themeBtn")
  .addEventListener(
    "click",
    ()=>{

      document.body.classList.toggle(
        "light"
      );
    }
  );

/* =========================================================
   MENU
========================================================= */

const menuBtn =
  document.getElementById(
    "menuBtn"
  );

const topNav =
  document.getElementById(
    "topNav"
  );

menuBtn.addEventListener(
  "click",
  ()=>{

    topNav.classList.toggle(
      "open"
    );
  }
);

/*
 * Не позволяем горизонтальному
 * свайпу навигации двигать карту.
 */

[
  "touchstart",
  "touchmove",
  "touchend",
  "pointerdown",
  "pointermove",
  "pointerup"
].forEach(type=>{

  topNav.addEventListener(
    type,
    e=>{
      e.stopPropagation();
    },
    {
      passive:false
    }
  );

});

/* =========================================================
   NAV ITEMS
========================================================= */

document
  .querySelectorAll(
    ".navItem:not(#layersNav)"
  )
  .forEach(item=>{

    item.addEventListener(
      "click",
      ()=>{

        document
          .querySelectorAll(".navItem:not(#layersNav)")
          .forEach(x=>
            x.classList.remove("active")
          );

        item.classList.add("active");

        /*
         * Слои остаётся активным
         * независимо от выбранного пункта.
         */

        document
          .getElementById("layersNav")
          .classList.add("active");
      }
    );

  });

/* =========================================================
   LAYERS BUTTON
========================================================= */

const layersNav =
  document.getElementById(
    "layersNav"
  );

const layersPanel =
  document.getElementById(
    "layersPanel"
  );

layersNav.addEventListener(
  "click",
  ()=>{

    const hidden =
      layersPanel.style.display === "none";

    layersPanel.style.display =
      hidden ? "block" : "none";

    layersNav.classList.add("active");
  }
);

/* =========================================================
   REFLECTIVITY SWITCH
========================================================= */

const reflectivitySwitch =
  document.getElementById(
    "reflectivitySwitch"
  );

reflectivitySwitch.addEventListener(
  "click",
  ()=>{

    reflectivitySwitch.classList.toggle(
      "on"
    );

    radarVisible =
      reflectivitySwitch.classList.contains(
        "on"
      );

    redrawRadar();
  }
);

/* =========================================================
   OTHER SWITCHES
========================================================= */

document
  .querySelectorAll(
    ".layer .switch"
  )
  .forEach(sw=>{

    if(sw === reflectivitySwitch)
      return;

    sw.addEventListener(
      "click",
      ()=>{
        sw.classList.toggle("on");
      }
    );
  });

/* =========================================================
   LEGEND
========================================================= */

const legend =
  document.getElementById(
    "legend"
  );

document
  .getElementById("legendTab")
  .addEventListener(
    "click",
    ()=>{
      legend.classList.add("open");
    }
  );

document
  .getElementById("legendClose")
  .addEventListener(
    "click",
    ()=>{
      legend.classList.remove("open");
    }
  );

/* =========================================================
   MAP BUTTONS
========================================================= */

document
  .getElementById("zoomIn")
  .addEventListener(
    "click",
    ()=>{
      if(map)
        map.zoomIn();
    }
  );

document
  .getElementById("zoomOut")
  .addEventListener(
    "click",
    ()=>{
      if(map)
        map.zoomOut();
    }
  );

/* =========================================================
   GEOLOCATION
========================================================= */

document
  .getElementById("locateBtn")
  .addEventListener(
    "click",
    ()=>{

      if(!map)
        return;

      if(!navigator.geolocation)
        return;

      navigator.geolocation.getCurrentPosition(
        position=>{

          map.setView(
            [
              position.coords.latitude,
              position.coords.longitude
            ],
            9,
            {
              animate:true
            }
          );

        },
        error=>{
          console.warn(
            "Geolocation:",
            error
          );
        },
        {
          enableHighAccuracy:true,
          timeout:10000,
          maximumAge:30000
        }
      );

    }
  );

/* =========================================================
   OUTSIDE CLICK
========================================================= */

document.addEventListener(
  "click",
  e=>{

    if(
      !settingsPopup.contains(e.target) &&
      e.target !== settingsBtn
    ){
      settingsPopup.style.display =
        "none";
    }

    if(
      !searchPopup.contains(e.target) &&
      e.target !== searchBtn
    ){
      searchPopup.style.display =
        "none";
    }

  }
);

/* =========================================================
   START
========================================================= */

(async function(){

  try{

    await loadLeaflet();

    initMap();

    await loadNowcastTimes();

  }catch(error){

    console.error(
      "CLOrad startup:",
      error
    );

  }

})();
</script>
